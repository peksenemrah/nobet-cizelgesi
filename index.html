<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nöbet Çizelgesi</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--accent:#4f46e5;--line:#e2e8f0;
--a-blok:#dbeafe;--b-blok:#dcfce7;--c-blok:#fef3c7;--czemin:#ffedd5;--bahce:#f3e8ff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;text-align:center}
header h1{margin:0;font-size:18px}
header .sub{color:var(--muted);font-size:13px;margin-top:3px}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
select,button{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}
button{cursor:pointer}
#who{width:100%;margin-top:8px}
.wnav{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.wnav select{flex:1;min-width:0}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border:1px solid var(--line);padding:4px 5px;font-size:12px;text-align:center;vertical-align:top}
th{background:#f8fafc;padding:6px 4px}
th.dayh{width:80px;text-align:left}
th.rA{background:var(--a-blok)}th.rB{background:var(--b-blok)}th.rC{background:var(--c-blok)}th.rCZ{background:var(--czemin)}th.rBH{background:var(--bahce)}
td.dayName{font-weight:600;text-align:left;background:#f8fafc;vertical-align:middle}
td.dayName .dsub{font-weight:400;color:var(--muted);font-size:11px}
td.admCell{background:#f8fafc;font-weight:600;font-size:11.5px;vertical-align:middle}
td.hol{background:#fef2f2;color:#b91c1c;font-weight:600}
.mytable{min-width:0}
.chip{display:block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:7px;padding:3px 5px;margin:2px 0;font-size:11.5px;line-height:1.3;word-break:break-word}
.chip.second{background:#fff7ed;border-color:#fb923c;color:#9a3412;font-weight:700}
.chip.me{outline:2px solid var(--accent)}
.grptitle{font-weight:700;font-size:13px;color:#334155;background:#f8fafc;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:6px 10px;margin-top:12px}
.next{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:10px;margin:10px 0;font-size:14px}
.dblrow{background:#fff7ed}
.dbadge{background:#fb923c;color:#fff;border-radius:6px;font-size:10px;padding:1px 6px;margin-left:5px;font-weight:700;white-space:nowrap}
.dblnote{color:#9a3412;font-size:12.5px;margin-top:6px}
details.faq{border-bottom:1px solid var(--line);padding:9px 2px}
details.faq:last-child{border-bottom:none}
details.faq summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
details.faq .ans{font-size:13.5px;color:#334155;line-height:1.55;margin:8px 2px 2px;padding-left:6px;border-left:3px solid #c7d2fe}
.faqhint{color:var(--muted);font-size:12.5px;margin-top:6px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:12px 0}
</style>
</head>
<body>
<header><h1 id="ttl"></h1><div class="sub" id="sub"></div></header>
<main>
<div class="card">
  <b>🔍 Nöbetlerim</b>
  <select id="who"><option value="">— Adınızı seçin —</option></select>
  <div id="me"></div>
</div>
<div class="card">
  <div class="wnav"><button id="prev">◀</button><select id="wsel"></select><button id="next">▶</button></div>
  <div id="week"></div>
</div>
<div class="card">
  <b>❓ Sıkça Sorulan Sorular</b>
  <div class="faqhint" id="faqhint"></div>
  <div id="faq"></div>
</div>
<div class="foot" id="gen"></div>
</main>

    AREAS.forEach(function(a){h+='<th class="'+AC[a]+'">'+a+'</th>';});
    if(hasAdm)h+='<th>Nöbetçi Müdür Yrd.</th>';
    h+='</tr>';
    w.days.forEach(function(d){
      h+='<tr><td class="dayName">'+dayName(d)+' <span class="dsub">'+fmtShort(d)+'</span></td>';
      if(HM[d]){h+='<td class="hol" colspan="'+(AREAS.length+(hasAdm?1:0))+'">TATİL — '+esc(HM[d])+'</td></tr>';return;}
      AREAS.forEach(function(a){
        var ids=(sched[d]&&sched[d][a])||[];h+='<td>';
        ids.forEach(function(id){
          var t=byId[id];var n=occ[id+'|'+d+'|'+a]||1;
          h+='<span class="chip'+(n>1?' second':'')+(id===meId?' me':'')+'">'+(t?esc(t.name):'?')+(n>1?' <b>('+n+')</b>':'')+'</span>';
        });
        h+='</td>';
      });
      if(hasAdm)h+='<td class="admCell">'+esc(DATA.adminByDate[d]||'')+'</td>';
      h+='</tr>';
    });
    h+='</table></div>';
  });
  box.innerHTML=h;
}
renderWeek();
renderFaq();
}
